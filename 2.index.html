
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earbuds Control</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101114;
  color: white;
}

.app {
  max-width: 430px;
  margin: auto;
  padding: 24px 18px 35px;
}

h1 {
  text-align: center;
  margin: 8px 0 5px;
  font-size: 28px;
}

.sub {
  text-align: center;
  color: #9da0a8;
  margin-bottom: 25px;
}

.card {
  background: #1b1d22;
  border: 1px solid #2b2e35;
  border-radius: 22px;
  padding: 20px;
  margin-bottom: 15px;
}

.earbuds {
  display: flex;
  justify-content: space-around;
  padding: 15px 0 22px;
}

.bud {
  width: 95px;
  height: 125px;
  background: #eee;
  border-radius: 45px 45px 35px 35px;
  position: relative;
}

.bud:after {
  content: "";
  position: absolute;
  width: 28px;
  height: 65px;
  background: #eee;
  bottom: -42px;
  left: 34px;
  border-radius: 0 0 18px 18px;
}

.bud span {
  position: absolute;
  color: #111;
  font-weight: bold;
  top: 48px;
  left: 38px;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.value {
  color: #9fe7ff;
  font-weight: bold;
}

input[type="range"] {
  width: 100%;
  accent-color: #62d9ff;
  height: 6px;
}

button {
  border: 0;
  border-radius: 14px;
  padding: 13px 18px;
  background: #62d9ff;
  color: #071014;
  font-weight: bold;
  font-size: 15px;
}

.buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
}

button.secondary {
  background: #292c33;
  color: white;
}

.status {
  text-align: center;
  color: #71e6a3;
  margin-top: 14px;
  font-size: 14px;
}

.small {
  font-size: 12px;
  color: #898d96;
  line-height: 1.5;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="app">

<h1>🎧 Earbuds Control</h1>
<div class="sub">Left & Right Audio Control</div>

<div class="card">

<div class="earbuds">
  <div class="bud"><span>L</span></div>
  <div class="bud"><span>R</span></div>
</div>

<div class="row">
  <b>Left Volume</b>
  <span class="value" id="lv">50%</span>
</div>

<input id="left" type="range" min="0" max="100" value="50">

<br><br>

<div class="row">
  <b>Right Volume</b>
  <span class="value" id="rv">50%</span>
</div>

<input id="right" type="range" min="0" max="100" value="50">

</div>


<div class="card">

<div class="row">
  <b>Master Volume</b>
  <span class="value" id="mv">70%</span>
</div>

<input id="master" type="range" min="0" max="100" value="70">

<br><br>

<div class="row">
  <b>Balance</b>
  <span class="value" id="bv">Center</span>
</div>

<input id="balance" type="range" min="-100" max="100" value="0">

</div>


<div class="card">

<div class="buttons">

<button id="test">
▶ Test Sound
</button>

<button class="secondary" id="reset">
Reset
</button>

</div>

<div class="status" id="status">
Ready
</div>

<div class="small">
This demo controls audio generated by the webpage.
A normal browser cannot directly change the physical
left/right hardware volume of arbitrary Bluetooth earbuds.
</div>

</div>

</div>


<script>

const left = document.getElementById("left");
const right = document.getElementById("right");
const master = document.getElementById("master");
const balance = document.getElementById("balance");

const lv = document.getElementById("lv");
const rv = document.getElementById("rv");
const mv = document.getElementById("mv");
const bv = document.getElementById("bv");

const status = document.getElementById("status");


function update() {

  lv.textContent = left.value + "%";
  rv.textContent = right.value + "%";
  mv.textContent = master.value + "%";

  let b = Number(balance.value);

  if (b === 0) {
    bv.textContent = "Center";
  }

  else if (b < 0) {
    bv.textContent = "Left " + Math.abs(b) + "%";
  }

  else {
    bv.textContent = "Right " + b + "%";
  }
}


[left, right, master, balance].forEach(
  slider => slider.addEventListener("input", update)
);


document.getElementById("reset").onclick = function() {

  left.value = 50;
  right.value = 50;
  master.value = 70;
  balance.value = 0;

  update();

  status.textContent = "Settings reset";
};


document.getElementById("test").onclick = async function() {

  const AudioContext =
    window.AudioContext || window.webkitAudioContext;

  if (!AudioContext) {

    status.textContent =
      "Audio not supported";

    return;
  }

  const ctx = new AudioContext();

  const oscillator =
    ctx.createOscillator();

  const gain =
    ctx.createGain();

  const pan =
    ctx.createStereoPanner();

  oscillator.frequency.value = 440;

  gain.gain.value =
    (Number(master.value) / 100) * 0.15;

  pan.pan.value =
    Number(balance.value) / 100;

  oscillator
    .connect(gain)
    .connect(pan)
    .connect(ctx.destination);

  oscillator.start();

  status.textContent =
    "Playing test sound...";

  setTimeout(() => {

    oscillator.stop();

    ctx.close();

    status.textContent =
      "Ready";

  }, 800);

};


update();

</script>

</body>
  </html>
