<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CallNet</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#eef2f5;
    color:#101418;
}

.app{
    max-width:480px;
    min-height:100vh;
    margin:auto;
    background:#fff;
    padding-bottom:76px;
}

/* HEADER */

header{
    height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #eee;
}

.logo{
    font-size:24px;
    font-weight:800;
}

.online{
    color:#18a558;
    font-size:13px;
}


/* PAGES */

.page{
    display:none;
    padding:20px;
}

.page.active{
    display:block;
}

h1{
    font-size:26px;
    margin-bottom:20px;
}


/* DIALER */

.display{
    height:90px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    letter-spacing:2px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
    max-width:330px;
    margin:auto;
}

.key{
    height:68px;
    border:0;
    border-radius:50%;
    background:#f0f2f4;
    font-size:25px;
}

.key:active{
    background:#dce1e5;
}

.key small{
    display:block;
    font-size:9px;
    color:#777;
}

.call{
    display:block;
    margin:24px auto;
    width:72px;
    height:72px;
    border:0;
    border-radius:50%;
    background:#18a558;
    color:#fff;
    font-size:28px;
}


/* CALL LIST */

.item{
    display:flex;
    align-items:center;
    gap:13px;
    padding:14px 0;
    border-bottom:1px solid #eee;
}

.avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#e5e9ed;
    display:grid;
    place-items:center;
    font-weight:bold;
    font-size:20px;
}

.info{
    flex:1;
}

.name{
    font-weight:bold;
}

.number{
    font-size:13px;
    color:#777;
    margin-top:4px;
}

.phone{
    border:0;
    background:#18a558;
    color:#fff;
    width:42px;
    height:42px;
    border-radius:50%;
    font-size:18px;
}


/* SEARCH */

.search{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:10px;
    font-size:15px;
}


/* BOTTOM NAVIGATION */

nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    height:70px;
    background:#fff;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:10;
}

nav button{
    border:0;
    background:none;
    font-size:21px;
    cursor:pointer;
}

nav span{
    display:block;
    font-size:11px;
    margin-top:4px;
}

nav .active{
    color:#18a558;
}


/* CALLING SCREEN */

.calling{
    position:fixed;
    inset:0;
    background:#11161a;
    color:#fff;
    display:none;
    z-index:50;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.calling.show{
    display:flex;
}

.big{
    width:105px;
    height:105px;
    border-radius:50%;
    background:#303840;
    display:grid;
    place-items:center;
    font-size:42px;
    margin-bottom:18px;
}

.cname{
    font-size:27px;
    font-weight:bold;
}

.cnumber{
    color:#aaa;
    margin-top:7px;
}

.state{
    margin-top:14px;
    color:#aaa;
}

.controls{
    position:absolute;
    bottom:65px;
    display:flex;
    gap:22px;
}

.control{
    width:58px;
    height:58px;
    border:0;
    border-radius:50%;
    background:#303840;
    color:#fff;
    font-size:22px;
}

.end{
    background:#e53935;
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">
CallNet
</div>

<div class="online">
● Online
</div>

</header>


<!-- DIAL -->

<section id="dial" class="page active">

<h1>Dial Number</h1>

<div id="display" class="display"></div>

<div class="grid">

<button class="key" onclick="p('1')">
1
</button>

<button class="key" onclick="p('2')">
2
<small>ABC</small>
</button>

<button class="key" onclick="p('3')">
3
<small>DEF</small>
</button>


<button class="key" onclick="p('4')">
4
<small>GHI</small>
</button>

<button class="key" onclick="p('5')">
5
<small>JKL</small>
</button>

<button class="key" onclick="p('6')">
6
<small>MNO</small>
</button>


<button class="key" onclick="p('7')">
7
<small>PQRS</small>
</button>

<button class="key" onclick="p('8')">
8
<small>TUV</small>
</button>

<button class="key" onclick="p('9')">
9
<small>WXYZ</small>
</button>


<button class="key" onclick="p('*')">
*
</button>

<button class="key" onclick="p('0')">
0
<small>+</small>
</button>

<button class="key" onclick="back()">
⌫
</button>

</div>


<button class="call" onclick="dial()">
☎
</button>

</section>


<!-- RECENT CALLS -->

<section id="recent" class="page">

<h1>
Recent Calls
</h1>


<div class="item">

<div class="avatar">
R
</div>

<div class="info">

<div class="name">
Rahul
</div>

<div class="number">
98XXXXXXXX · Incoming
</div>

</div>

<button class="phone"
onclick="start('Rahul','98XXXXXXXX')">
☎
</button>

</div>


<div class="item">

<div class="avatar">
S
</div>

<div class="info">

<div class="name">
Suman
</div>

<div class="number">
97XXXXXXXX · Outgoing
</div>

</div>

<button class="phone"
onclick="start('Suman','97XXXXXXXX')">
☎
</button>

</div>

</section>


<!-- CONTACTS -->

<section id="contacts" class="page">

<h1>
Contacts
</h1>

<input
class="search"
placeholder="Search contacts"
oninput="filter(this.value)"
>


<div id="contacts">


<div class="item contact">

<div class="avatar">
R
</div>

<div class="info">

<div class="name">
Rahul
</div>

<div class="number">
98XXXXXXXX
</div>

</div>

<button class="phone"
onclick="start('Rahul','98XXXXXXXX')">
☎
</button>

</div>


<div class="item contact">

<div class="avatar">
S
</div>

<div class="info">

<div class="name">
Suman
</div>

<div class="number">
97XXXXXXXX
</div>

</div>

<button class="phone"
onclick="start('Suman','97XXXXXXXX')">
☎
</button>

</div>


</div>

</section>


<!-- PROFILE -->

<section id="profile" class="page">

<h1>
Profile
</h1>

<div class="item">

<div class="avatar">
A
</div>

<div class="info">

<div class="name">
Amit
</div>

<div class="number">
CallNet Account
</div>

</div>

</div>

<p style="color:#666;margin-top:20px;">
Internet calling account
</p>

</section>


<!-- NAVIGATION -->

<nav>

<button
class="active"
onclick="page('dial',this)"
>
⌨️
<span>Dial</span>
</button>


<button
onclick="page('recent',this)"
>
🕘
<span>Recent</span>
</button>


<button
onclick="page('contacts',this)"
>
👥
<span>Contacts</span>
</button>


<button
onclick="page('profile',this)"
>
👤
<span>Profile</span>
</button>

</nav>

</div>


<!-- CALL SCREEN -->

<div id="calling" class="calling">

<div id="ca" class="big">
R
</div>

<div id="cn" class="cname">
Rahul
</div>

<div id="cp" class="cnumber">
98XXXXXXXX
</div>

<div id="state" class="state">
Connecting through Internet...
</div>


<div class="controls">

<button
class="control"
onclick="alert('Microphone muted')"
>
🎤
</button>

<button
class="control"
onclick="alert('Speaker on')"
>
🔊
</button>

<button
class="control end"
onclick="end()"
>
☎
</button>

</div>

</div>


<script>

let n = "";


/* DIAL PAD */

function p(x){

    n += x;

    document.getElementById("display")
    .textContent = n;

}


/* DELETE */

function back(){

    n = n.slice(0,-1);

    document.getElementById("display")
    .textContent = n;

}


/* DIAL */

function dial(){

    if(n.length < 3){

        alert("Enter a phone number");

        return;

    }

    start("Unknown",n);

}


/* START CALL */

function start(name,phone){

    document.getElementById("cn")
    .textContent = name;

    document.getElementById("cp")
    .textContent = phone;

    document.getElementById("ca")
    .textContent =
        name[0].toUpperCase();

    document.getElementById("state")
    .textContent =
        "Connecting through Internet...";

    document.getElementById("calling")
    .classList.add("show");


    setTimeout(function(){

        document.getElementById("state")
        .textContent =
            "Calling...";

    },1200);

}


/* END CALL */

function end(){

    document.getElementById("calling")
    .classList.remove("show");

}


/* PAGE */

function page(id,button){

    document.querySelectorAll(".page")
    .forEach(function(x){

        x.classList.remove("active");

    });


    document.getElementById(id)
    .classList.add("active");


    document.querySelectorAll("nav button")
    .forEach(function(x){

        x.classList.remove("active");

    });


    button.classList.add("active");

}


/* SEARCH */

function filter(value){

    value =
        value.toLowerCase();


    document.querySelectorAll(".contact")
    .forEach(function(x){

        x.style.display =
            x.textContent
            .toLowerCase()
            .includes(value)
            ? "flex"
            : "none";

    });

}

</script>

</body>
</html>
